<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行前准备 - 旅行规划</title>
    <link rel="stylesheet" href="../styles/theme.css?v=5">
    <link rel="stylesheet" href="../styles/pre-departure.css?v=3">
</head>
<body>
    <!-- 登录弹窗 -->
    <div id="login-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header"><h3>用户登录</h3></div>
            <div class="modal-body">
                <div class="login-form">
                    <div class="form-group">
                        <label for="login-username">用户名：</label>
                        <input type="text" id="login-username" class="form-input" placeholder="用户名：djy / xwz / mrb / hrz / zyt" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码：</label>
                        <input type="password" id="login-password" class="form-input" placeholder="初始密码为 用户名+1234" autocomplete="current-password">
                    </div>
                    <button class="btn-login" id="login-btn" type="button">登录</button>
                    <button class="btn-register" id="register-btn" type="button" style="margin-top: 10px; width: 100%; display: none;">注册新账户</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div id="register-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header"><h3>注册新账户</h3><button class="modal-close" onclick="closeRegisterModal()">×</button></div>
            <div class="modal-body">
                <div class="form-group"><label for="register-username">用户名：</label><input type="text" id="register-username" class="form-input" placeholder="字母数字下划线"></div>
                <div class="form-group"><label for="register-password">密码：</label><input type="password" id="register-password" class="form-input" placeholder="至少6位" minlength="6"></div>
                <div class="form-group"><label for="register-confirm">确认密码：</label><input type="password" id="register-confirm" class="form-input" placeholder="请再次输入密码" minlength="6"></div>
                <div class="form-group"><label for="register-invite-code">邀请码：</label><input type="text" id="register-invite-code" class="form-input" placeholder="请输入邀请码"></div>
                <div class="config-actions" style="margin-top: 20px;">
                    <button class="btn-primary" onclick="registerUser()">注册账户</button>
                    <button class="btn-secondary" onclick="closeRegisterModal()">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div id="main-content" style="display: none;">
        <div id="pre-departure-app">
            <!-- 顶部导航 -->
            <nav class="top-nav">
                <h1>行前准备</h1>
                <div class="nav-buttons">
                    <button id="nav-pre-departure" class="nav-btn active">行前准备</button>
                    <button id="nav-itinerary" class="nav-btn">行程规划</button>
                    <button id="nav-post-trip" class="nav-btn">行后复盘</button>
                </div>
            </nav>

            <!-- 登录态栏 -->
            <div id="user-logged-in" class="user-sync-container" style="display: none;">
                <div class="user-sync-header">
                    <div class="user-info">
                        <span class="user-label">当前用户：</span>
                        <span id="logged-in-user-name" class="user-name"></span>
                        <span id="sync-status" class="sync-status"></span>
                    </div>
                    <div class="sync-buttons-top">
                        <button class="btn-logout" onclick="handleLogout()" title="退出登录">×</button>
                    </div>
                </div>
            </div>

            <main class="main-content">
                <section id="calendar-section" class="section">
                    <h2>📅 有空时间</h2>
                    <div id="calendar-container"></div>
                </section>
                <section id="message-board-section" class="section">
                    <h2>💬 留言板</h2>
                    <div id="message-board-container"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- Firebase 初始化 -->
    <script type="module" src="../modules/storage/firebase-init.js"></script>
    <!-- 核心 -->
    <script src="../modules/core/utils.js"></script>
    <script src="../modules/core/state-manager.js"></script>
    <script src="../modules/core/event-bus.js"></script>
    <script src="../modules/core/auth-manager.js?v=6"></script>
    <!-- 存储 -->
    <script src="../modules/storage/module-store.js"></script>
    <script src="../modules/storage/trip-registry.js?v=3"></script>
    <!-- 功能模块 -->
    <script src="../modules/pre-departure/shared-calendar.js?v=4"></script>
    <script src="../modules/pre-departure/message-board.js"></script>
    <script src="../modules/pre-departure/pre-departure-app.js"></script>
</body>
</html>
