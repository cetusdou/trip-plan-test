<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程规划 - 旅行规划</title>
    <link rel="stylesheet" href="../styles/theme.css?v=5">
    <link rel="stylesheet" href="../styles/itinerary-planning.css?v=4">
</head>
<body>
    <!-- 登录弹窗（未登录时也能看到，必须在 main-content 外面） -->
    <div id="login-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header"><h3>用户登录</h3></div>
            <div class="modal-body">
                <div class="login-form">
                    <div class="form-group">
                        <label for="login-username">用户名：</label>
                        <input type="text" id="login-username" class="form-input" placeholder="用户名：djy / xwz / mrb / hrz / zyt" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码：</label>
                        <input type="password" id="login-password" class="form-input" placeholder="初始密码为 用户名+1234" autocomplete="current-password">
                    </div>
                    <button class="btn-login" id="login-btn" type="button">登录</button>
                    <button class="btn-register" id="register-btn" type="button" style="margin-top: 10px; width: 100%; display: none;">注册新账户</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 注册账户模态框 -->
    <div id="register-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>注册新账户</h3>
                <button class="modal-close" onclick="closeRegisterModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="register-username">用户名：</label>
                    <input type="text" id="register-username" class="form-input" placeholder="字母数字下划线" pattern="^[a-zA-Z0-9_]+">
                </div>
                <div class="form-group">
                    <label for="register-password">密码：</label>
                    <input type="password" id="register-password" class="form-input" placeholder="至少6位" minlength="6">
                </div>
                <div class="form-group">
                    <label for="register-confirm">确认密码：</label>
                    <input type="password" id="register-confirm" class="form-input" placeholder="请再次输入密码" minlength="6">
                </div>
                <div class="form-group">
                    <label for="register-invite-code">邀请码：</label>
                    <input type="text" id="register-invite-code" class="form-input" placeholder="请输入邀请码" required>
                </div>
                <div class="config-actions" style="margin-top: 20px;">
                    <button class="btn-primary" onclick="registerUser()">注册账户</button>
                    <button class="btn-secondary" onclick="closeRegisterModal()">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-container" id="main-content" style="display: none;">
        <!-- 顶部模块导航 -->
        <nav class="top-nav">
            <h1>行程规划</h1>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="window.location.href='pre-departure.html'">行前准备</button>
                <button class="nav-btn active">行程规划</button>
                <button class="nav-btn" onclick="window.location.href='post-trip.html'">行后复盘</button>
            </div>
        </nav>

        <!-- 已登录用户 + 同步 -->
        <div id="user-logged-in" class="user-sync-container" style="display: none;">
            <div class="user-sync-header">
                <div class="user-info">
                    <span class="user-label">当前用户：</span>
                    <span id="logged-in-user-name" class="user-name"></span>
                    <span id="sync-status" class="sync-status"></span>
                </div>
                <div class="sync-buttons-top">
                    <button class="sync-btn sync-btn-upload" onclick="syncUpload()" title="手动上传到云端">↑</button>
                    <button class="sync-btn sync-btn-download" onclick="syncDownload()" title="从云端下载">↓</button>
                    <button class="btn-logout" onclick="handleLogout()" title="退出登录">×</button>
                </div>
            </div>
        </div>

        <!-- 新增行程项模态框 -->
        <div id="add-item-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>新增行程项</h3>
                    <button class="modal-close" onclick="closeAddItemModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="config-section">
                        <label for="new-item-category">事项名称 *</label>
                        <input type="text" id="new-item-category" placeholder="例如：早餐、景点游览等" required>
                    </div>
                    <div class="config-section">
                        <label for="new-item-time">时间</label>
                        <input type="text" id="new-item-time" placeholder="例如：08:00-10:00">
                    </div>
                    <div class="config-section">
                        <label for="new-item-plan">计划</label>
                        <textarea id="new-item-plan" rows="3" placeholder="输入计划内容..."></textarea>
                    </div>
                    <div class="config-section">
                        <label for="new-item-note">备注</label>
                        <textarea id="new-item-note" rows="3" placeholder="输入备注信息..."></textarea>
                    </div>
                    <div class="config-section">
                        <label for="new-item-tag">分类标签</label>
                        <select id="new-item-tag">
                            <option value="其他">📋 其他</option>
                            <option value="景点">🏛️ 景点</option>
                            <option value="美食">🍜 美食</option>
                            <option value="住宿">🏨 住宿</option>
                            <option value="赶路">🚗 赶路</option>
                        </select>
                    </div>
                    <div class="config-actions">
                        <button class="btn-primary" onclick="saveNewItem()">保存</button>
                        <button class="btn-secondary" onclick="closeAddItemModal()">取消</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 开支总计模态框 -->
        <div id="expense-summary-modal" class="modal" style="display: none;">
            <div class="modal-content" style="max-width: 800px;">
                <div class="modal-header">
                    <h3>开支总计</h3>
                    <button class="modal-close" onclick="closeExpenseSummary()">×</button>
                </div>
                <div class="modal-body" id="expense-summary-content"></div>
            </div>
        </div>

        <!-- 大图查看器模态框 -->
        <div id="image-viewer-modal" class="modal image-viewer-modal" style="display: none;">
            <div class="modal-content image-viewer-content">
                <button class="modal-close image-viewer-close" id="image-viewer-close" title="关闭">×</button>
                <button class="image-viewer-nav image-viewer-prev" id="image-viewer-prev" title="上一张">‹</button>
                <div class="image-viewer-main">
                    <img id="image-viewer-img" src="" alt="查看大图" />
                    <div class="image-viewer-info" id="image-viewer-info"></div>
                </div>
                <button class="image-viewer-nav image-viewer-next" id="image-viewer-next" title="下一张">›</button>
            </div>
        </div>

        <!-- 行程切换器（多行程） -->
        <div id="trip-switcher" class="trip-switcher"></div>

        <!-- 标题区域 -->
        <div class="header"><h1>行程计划</h1></div>

        <!-- 目录导航 -->
        <div class="nav-container">
            <h2>行程总览</h2>
            <ul class="nav-list"></ul>
        </div>

        <!-- 筛选面板 -->
        <div id="filter-panel" class="filter-panel" style="display: none;">
            <div class="filter-buttons">
                <button class="filter-tag-btn" onclick="setFilter('all')">全部</button>
                <button class="filter-tag-btn" onclick="setFilter('景点')">🏛️ 景点</button>
                <button class="filter-tag-btn" onclick="setFilter('美食')">🍜 美食</button>
                <button class="filter-tag-btn" onclick="setFilter('住宿')">🏨 住宿</button>
                <button class="filter-tag-btn" onclick="setFilter('赶路')">🚗 赶路</button>
                <button class="filter-tag-btn" onclick="setFilter('其他')">📋 其他</button>
            </div>
        </div>

        <!-- 日期标题 -->
        <div class="day-header"><h2>请选择日期</h2></div>

        <!-- 卡片容器 -->
        <div id="cards-container" class="cards-container">
            <div class="card-indicator"></div>
        </div>
    </div>

    <!-- Firebase 初始化（Firestore + Auth），ES Module，自动 defer -->
    <script type="module" src="../modules/storage/firebase-init.js?v=2"></script>

    <!-- 核心模块 -->
    <script src="../modules/core/utils.js"></script>
    <script src="../modules/core/state-manager.js"></script>
    <script src="../modules/core/event-bus.js"></script>
    <script src="../modules/core/ui-renderer.js?v=4"></script>
    <script src="../modules/core/auth-manager.js?v=7"></script>
    <script src="../modules/core/app-initializer.js"></script>

    <!-- 存储层（Firestore 兼容层 + 图片 + 开支） -->
    <script src="../modules/storage/trip-registry.js?v=3"></script>
    <script src="../modules/storage/firestore-store.js?v=4"></script>
    <script src="../modules/storage/cloudinary.js"></script>
    <script src="../modules/storage/expense-manager.js"></script>

    <!-- 行程规划模块 -->
    <script src="../modules/itinerary-planning/like-handler.js"></script>
    <script src="../modules/itinerary-planning/data-manager.js?v=3"></script>
    <script src="../modules/itinerary-planning/card-slider.js?v=4"></script>

    <!-- 外部依赖 -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <!-- 主胶水逻辑 -->
    <script src="../modules/itinerary-planning/script.js"></script>

    <!-- 行程切换器（多行程） -->
    <script src="../modules/itinerary-planning/trip-switcher.js?v=3"></script>
</body>
</html>
