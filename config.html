<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同步配置</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .config-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .config-header {
            background: linear-gradient(135deg, #396185 0%, #517194 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        
        .config-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        
        .config-header p {
            margin: 8px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        
        .config-body {
            padding: 30px;
        }
        
        .config-section {
            margin-bottom: 24px;
        }
        
        .config-section label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 8px;
        }
        
        .config-section input[type="text"],
        .config-section input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        
        .config-section input:focus {
            outline: none;
            border-color: #396185;
        }
        
        .config-section small {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: #666;
        }
        
        .config-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        .btn-primary,
        .btn-secondary {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #396185 0%, #517194 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(57, 97, 133, 0.4);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #396185;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .status-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="config-container">
        <div class="config-header">
            <h1>🔧 同步配置</h1>
            <p>配置 Firebase 数据库连接信息</p>
        </div>
        
        <div class="config-body">
            <div id="status-message" style="display: none;"></div>
            
            <!-- Firebase 配置 -->
            <div class="config-section">
                <label for="firebase-api-key">API Key：</label>
                <input type="text" id="firebase-api-key" placeholder="AIza...">
            </div>
            
            <div class="config-section">
                <label for="firebase-auth-domain">Auth Domain：</label>
                <input type="text" id="firebase-auth-domain" placeholder="your-project.firebaseapp.com">
            </div>
            
            <div class="config-section">
                <label for="firebase-database-url">Database URL：</label>
                <input type="text" id="firebase-database-url" placeholder="https://your-project.firebaseio.com">
            </div>
            
            <div class="config-section">
                <label for="firebase-project-id">Project ID：</label>
                <input type="text" id="firebase-project-id" placeholder="your-project-id">
            </div>
            
            <div class="config-section">
                <label for="firebase-database-path">Database Path（可选）：</label>
                <input type="text" id="firebase-database-path" placeholder="trip_plan_data" value="trip_plan_data">
                <small>数据存储路径，默认：trip_plan_data</small>
            </div>
            
            <div class="config-section">
                <small style="color: #666;">⚠️ 注意：配置信息将保存在本地浏览器中，不会上传到云端。</small>
            </div>
            
            <div class="config-actions">
                <button class="btn-primary" onclick="saveConfig()">保存配置</button>
                <button class="btn-secondary" onclick="loadCurrentConfig()">加载当前配置</button>
            </div>
            
            <a href="index.html" class="back-link">← 返回主页面</a>
        </div>
    </div>
    
    <script>
        // 从 localStorage 加载当前配置
        function loadCurrentConfig() {
            const configStr = localStorage.getItem('trip_firebase_config');
            if (configStr) {
                try {
                    const config = JSON.parse(configStr);
                    document.getElementById('firebase-api-key').value = config.apiKey || '';
                    document.getElementById('firebase-auth-domain').value = config.authDomain || '';
                    document.getElementById('firebase-database-url').value = config.databaseURL || '';
                    document.getElementById('firebase-project-id').value = config.projectId || '';
                    document.getElementById('firebase-database-path').value = config.databasePath || 'trip_plan_data';
                    showStatus('已加载当前配置', 'info');
                } catch (e) {
                    showStatus('加载配置失败', 'error');
                }
            } else {
                showStatus('未找到已保存的配置', 'info');
            }
        }
        
        // 保存配置到 localStorage
        function saveConfig() {
            const apiKey = document.getElementById('firebase-api-key').value.trim();
            const authDomain = document.getElementById('firebase-auth-domain').value.trim();
            const databaseURL = document.getElementById('firebase-database-url').value.trim();
            const projectId = document.getElementById('firebase-project-id').value.trim();
            const databasePath = document.getElementById('firebase-database-path').value.trim() || 'trip_plan_data';
            
            // 验证必填字段
            if (!apiKey || !authDomain || !databaseURL || !projectId) {
                showStatus('请填写所有必填字段', 'error');
                return;
            }
            
            const config = {
                apiKey: apiKey,
                authDomain: authDomain,
                databaseURL: databaseURL,
                projectId: projectId,
                databasePath: databasePath
            };
            
            try {
                localStorage.setItem('trip_firebase_config', JSON.stringify(config));
                showStatus('配置已保存！', 'success');
                
                // 3秒后跳转到主页面
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } catch (e) {
                showStatus('保存配置失败：' + e.message, 'error');
            }
        }
        
        // 显示状态消息
        function showStatus(message, type) {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            statusEl.style.display = 'block';
            
            // 3秒后自动隐藏
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 3000);
        }
        
        // 页面加载时尝试加载当前配置
        window.addEventListener('load', () => {
            loadCurrentConfig();
        });
    </script>
</body>
</html>
